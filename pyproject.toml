[project]
name = "lawscan"
version = "0.1.0"
description = "PDF ราชกิจจานุเบกษา เข้า CSV 33 คอลัมน์ ออก"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "google-genai>=1.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The reference arrives as a spreadsheet and the comparison goes back out as
# one. Optional because nothing in the pipeline itself needs it: `lawscan diff`
# without `--xlsx` reads and writes CSV and never imports this.
xlsx = ["openpyxl>=3.1"]
# GPT, DeepSeek and Kimi all speak the OpenAI chat API, so one package
# reaches all three. Optional because Gemini needs none of it.
openai = ["openai>=1.60"]

[project.scripts]
lawscan = "lawscan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lawscan"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
