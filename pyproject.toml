[project]
name = "lawscan"
version = "0.1.0"
description = "PDF ราชกิจจานุเบกษา เข้า CSV 33 คอลัมน์ ออก"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.24",
    "google-genai>=1.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
lawscan = "lawscan.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lawscan"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
